
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Buku - Libra</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50">

    <div class="min-h-screen flex">

        <!-- SIDEBAR -->
        <aside class="w-64 bg-emerald-950 text-white">

            <div class="px-6 py-6">
                <h1 class="text-2xl font-bold">
                    Perpustakaan<span class="text-emerald-400">.</span>
                </h1>

                <p class="text-xs text-emerald-200 mt-1">
                    Sistem Manajemen Perpustakaan
                </p>
            </div>

            <nav class="px-4 mt-4">

                <a href="index.html"
                   class="block px-4 py-3 rounded-lg text-emerald-100 hover:bg-emerald-800 mb-2">
                    Dashboard
                </a>

                <a href="data-buku.html"
                   class="block px-4 py-3 rounded-lg text-emerald-100 hover:bg-emerald-800 mb-2">
                    Data Buku
                </a>

                <a href="tambah-buku.html"
                   class="block px-4 py-3 rounded-lg bg-emerald-700 text-white mb-2">
                    Tambah Buku
                </a>

            </nav>

        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-1 p-8">

<header class="flex items-center justify-between mb-8">

    <div>
        <h2 class="text-2xl font-bold text-slate-800">
            Tambah Buku
        </h2>

        <p class="text-sm text-slate-500 mt-1">
            Tambahkan koleksi buku baru ke dalam perpustakaan.
        </p>
    </div>

    <div class="flex items-center gap-3">

        <div class="text-right">
            <p class="text-sm font-semibold text-slate-800">
                Administrator
            </p>

            <p class="text-xs text-slate-500">
                Admin Perpustakaan
            </p>
        </div>

        <div class="w-10 h-10 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-700 font-bold">
            A
        </div>

    </div>

</header>

<!-- BOOK FORM -->
<section class="bg-white rounded-xl border border-slate-200 p-8 max-w-4xl">

    <div class="mb-8">
        <h3 class="text-lg font-bold text-slate-800">
            Informasi Buku
        </h3>

        <p class="text-sm text-slate-500 mt-1">
            Lengkapi informasi buku yang ingin ditambahkan.
        </p>
    </div>

    <form>

        <!-- JUDUL BUKU -->
        <div class="mb-6">
            <label class="block text-sm font-medium text-slate-700 mb-2">
                Judul Buku
            </label>

            <input
                type="text"
                placeholder="Masukkan judul buku"
                class="w-full px-4 py-3 border border-slate-200 rounded-lg text-sm outline-none focus:border-emerald-500"
            >
        </div>

        <!-- PENULIS DAN PENERBIT -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">
                    Penulis
                </label>

                <input
                    type="text"
                    placeholder="Masukkan nama penulis"
                    class="w-full px-4 py-3 border border-slate-200 rounded-lg text-sm outline-none focus:border-emerald-500"
                >
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">
                    Penerbit
                </label>

                <input
                    type="text"
                    placeholder="Masukkan nama penerbit"
                    class="w-full px-4 py-3 border border-slate-200 rounded-lg text-sm outline-none focus:border-emerald-500"
                >
            </div>

        </div>

        <!-- KATEGORI DAN TAHUN -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">
                    Kategori
                </label>

                <select class="w-full px-4 py-3 border border-slate-200 rounded-lg text-sm text-slate-600 outline-none focus:border-emerald-500">

                    <option value="">Pilih kategori</option>
                    <option>Novel</option>
                    <option>Sejarah</option>
                    <option>Pendidikan</option>
                    <option>Pengembangan Diri</option>
                    <option>Teknologi</option>

                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">
                    Tahun Terbit
                </label>

                <input
                    type="number"
                    placeholder="Contoh: 2024"
                    class="w-full px-4 py-3 border border-slate-200 rounded-lg text-sm outline-none focus:border-emerald-500"
                >
            </div>

        </div>

        <!-- ISBN DAN STOK -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">
                    ISBN
                </label>

                <input
                    type="text"
                    placeholder="Masukkan nomor ISBN"
                    class="w-full px-4 py-3 border border-slate-200 rounded-lg text-sm outline-none focus:border-emerald-500"
                >
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">
                    Jumlah Stok
                </label>

                <input
                    type="number"
                    placeholder="Masukkan jumlah buku"
                    class="w-full px-4 py-3 border border-slate-200 rounded-lg text-sm outline-none focus:border-emerald-500"
                >
            </div>

        </div>

        <!-- BUTTON -->
        <div class="flex justify-end gap-3 border-t border-slate-100 pt-6">

            <a href="data-buku.html"
               class="px-5 py-3 rounded-lg border border-slate-200 text-slate-600 text-sm font-semibold hover:bg-slate-50">
                Batal
            </a>

            <button
                type="submit"
                class="px-5 py-3 rounded-lg bg-emerald-700 text-white text-sm font-semibold hover:bg-emerald-800">
                Simpan Buku
            </button>

        </div>

    </form>

</section>



        </main>

    </div>

</body>
</html>
